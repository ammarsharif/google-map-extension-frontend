<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generate Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; background: #f0f4f8; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #1e293b; }
    p { color: #64748b; line-height: 1.5; }
    canvas { margin: 10px; border: 1px dashed #ccc; }
    .btn { display: inline-block; padding: 10px 20px; background: #22c55e; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Icon Generator</h1>
    <!-- 
      INSTRUCTIONS:
      1. Open this file in your browser.
      2. The canvas will automatically draw the icon in 3 sizes.
      3. The browser will automatically download icon16.png, icon48.png, and icon128.png.
      4. Move those downloaded files into the "icons/" folder of your extension.
    -->
    <p>This page automatically generates the required extension icons and downloads them. Please move the downloaded PNG files (icon16.png, icon48.png, icon128.png) to the <code>icons/</code> folder.</p>
    <div id="canvases"></div>
    <button class="btn" onclick="generateAndDownload()">Generate Again</button>
  </div>

  <script>
    const sizes = [16, 48, 128];
    const container = document.getElementById('canvases');

    function drawIcon(ctx, size) {
      // Background rounded square
      ctx.fillStyle = '#22c55e'; // Green
      const radius = size * 0.2;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      // Draw map pin roughly
      const center = size / 2;
      const r = size * 0.25;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(center, center - (size * 0.1), r, Math.PI, 0, false);
      ctx.quadraticCurveTo(center + r, center + (size * 0.15), center, center + (size * 0.35));
      ctx.quadraticCurveTo(center - r, center + (size * 0.15), center - r, center - (size * 0.1));
      ctx.fill();
      
      // Inner circle
      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc(center, center - (size * 0.1), r * 0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function generateAndDownload() {
      sizes.forEach((size, index) => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        container.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        drawIcon(ctx, size);

        // Auto download
        setTimeout(() => {
          const link = document.createElement('a');
          link.download = `icon${size}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        }, index * 300);
      });
    }

    window.onload = generateAndDownload;
  </script>
</body>
</html>
