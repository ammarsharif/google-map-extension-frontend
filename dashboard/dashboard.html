<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leads Dashboard | Maps Scraper</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span class="brand-name">Maps<span class="accent-text">Scraper</span></span>
      </div>
      
      <nav class="nav-menu">
        <a href="#" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Overview
        </a>

      </nav>

      <div class="sidebar-footer">
        <div class="stats-mini">
          <div class="stat-item">
            <span class="stat-value" id="totalSavedCount">0</span>
            <span class="stat-label">Total Leads</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div class="search-wrapper">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
          <input type="text" id="searchInput" placeholder="Search by business name or category...">
        </div>
        <div class="top-bar-actions">
          <button id="refreshBtn" class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
          </button>
          <button id="exportAllBtn" class="btn-primary">
            Export All Leads
          </button>
        </div>
      </header>

      <div class="content-body">
        <div class="content-header">
          <h1>Businesses & Leads</h1>
          <p>Displaying all collected business data from your searches.</p>
        </div>

        <div class="table-container card">
          <div class="table-actions">

            <div class="pagination-info">
              <span id="paginationLabel">Page 1 of 1</span>
            </div>
          </div>

          <div id="loadingOverlay" class="loading-overlay">
            <div class="loader"></div>
            <span>Fetching data...</span>
          </div>

          <div class="table-scroll">
            <table id="leadsTable">
              <thead>
                <tr>
                  <th style="min-width: 250px;">Business Name</th>
                  <th style="min-width: 150px;">Category</th>
                  <th style="min-width: 140px;">Rating</th>
                  <th style="min-width: 160px;">Phone No.</th>
                  <th style="min-width: 180px;">Website</th>
                  <th style="min-width: 250px;">Address</th>
                  <th style="min-width: 100px;">Actions</th>
                </tr>
              </thead>
              <tbody id="leadsBody">
                <!-- Data will be injected here -->
              </tbody>
            </table>
          </div>

          <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
            </div>
            <h3>No leads found</h3>
            <p>Try searching in the workspace or adjust your search.</p>
          </div>

          <div class="table-footer">
            <div class="pagination">
              <button id="prevPage" class="btn-pagination" disabled>Previous</button>
              <div class="page-numbers" id="pageNumbers"></div>
              <button id="nextPage" class="btn-pagination" disabled>Next</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../env.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
